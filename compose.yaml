name: reconciliation-workbench

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: reconciliation
      POSTGRES_USER: reconciliation
      POSTGRES_PASSWORD: reconciliation-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconciliation -d reconciliation"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  web:
    build: .
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000"
    environment: &app-environment
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "local-development-key-not-for-deployment"
      DB_NAME: reconciliation
      DB_USER: reconciliation
      DB_PASSWORD: reconciliation-local-only
      DB_HOST: db
      DB_PORT: "5432"
      INGESTION_PRIVATE_ROOT: /var/lib/reconciliation/artifacts
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8010:8000"
    volumes:
      - artifact-data:/var/lib/reconciliation/artifacts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  worker:
    build: .
    command: python manage.py worker --interval 5
    environment:
      <<: *app-environment
      WORKER_HEARTBEAT_FILE: /tmp/reconciliation-worker-heartbeat
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - artifact-data:/var/lib/reconciliation/artifacts
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /tmp/reconciliation-worker-heartbeat && find /tmp/reconciliation-worker-heartbeat -mmin -1 | grep -q .",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  artifact-data:
